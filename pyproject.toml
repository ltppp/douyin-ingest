[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "douyin-ingest"
version = "0.1.0"
description = "Douyin content collection, ranking, media extraction, and transcription pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4,<5",
  "httpx[http2,socks]>=0.27,<1",
  "loguru>=0.7,<1",
  "playwright>=1.45,<2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
]
transcribe = [
  "faster-whisper>=1.1,<2",
]

[project.scripts]
douyin-ingest = "project.main:run"
douyin-crawl = "project.main:run"
douyin-doctor = "project.doctor:run"
douyin-transcribe = "project.transcribe_cli:run"

[tool.hatch.build.targets.wheel]
packages = ["project"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "smoke: optional tests that require local media, optional dependencies, and model files",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
